# 推送到 main 后自动把整站发布到 GitHub Pages
# 本站是纯静态 HTML/CSS，不需要构建步骤，直接打包上传仓库内容
name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 准备站点文件
        run: |
          # 仓库里的说明与 CI 配置不需要发布到网站上
          rm -rf .git .github README.md
          # 明确告诉 Pages 不要用 Jekyll 处理
          touch .nojekyll
          ls -la

      - name: 上传站点文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
