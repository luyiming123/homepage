# 推送到 main 后自动把整站发布到 GitHub Pages
# 本站是纯静态 HTML/CSS，不需要构建步骤，直接上传仓库内容
name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 准备站点文件
        run: |
          # 排除不需要发布的内容
          rm -rf .git .github README.md
          touch .nojekyll

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
